services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: swartz-playwright
    ports:
      - "3001:3000"
    environment:
      - CI=true
    volumes:
      - ./scripts/tests:/home/pwuser/project/tests
      - ./scripts/playwright-report:/home/pwuser/project/playwright-report
      - ./scripts/auth.json:/home/pwuser/project/auth.json
      - ./downloads:/home/pwuser/project/downloads
    networks:
      - swartz-network

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: swartz-telegram-bot
    depends_on:
      - playwright
    environment:
      - PW_TEST_CONNECT_WS_ENDPOINT=http://playwright:3000/
    volumes:
      - ./Secrets:/app/Secrets:ro
      - ./downloads:/app/downloads:ro
    networks:
      - swartz-network
    restart: unless-stopped

networks:
  swartz-network:
    driver: bridge
